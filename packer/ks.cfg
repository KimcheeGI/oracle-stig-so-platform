#version=RHEL9
# Kickstart file for Oracle Linux 9 automated installation

# System language and keyboard
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts=us

# Network configuration - DHCP with auto-activation
network --bootproto=dhcp --onboot=yes --activate --device=link

# Root password - MUST be set
rootpw --plaintext ${vm_root_password}

# Firewall and security
firewall --disabled
selinux --permissive

# System timezone
timezone UTC --utc

# Boot loader configuration
bootloader --location=mbr --boot-drive=sda

# Storage setup
zerombr
clearpart --all --initlabel --disklabel=msdos
part / --fstype=ext4 --size=1 --grow

# Services
services --enabled=sshd,NetworkManager

# Software packages
%packages
@core
@system-tools
@standard
openssh-server
openssh-clients
python3
python3-pip
git
%end

# Post-installation script
%post
# Enable SSH
systemctl enable sshd

# OL9/RHEL9 uses drop-in files in sshd_config.d/ that override sshd_config.
# Write a high-priority drop-in to allow root password login for Packer.
mkdir -p /etc/ssh/sshd_config.d
cat > /etc/ssh/sshd_config.d/01-packer.conf << 'EOF'
PermitRootLogin yes
PasswordAuthentication yes
EOF
chmod 600 /etc/ssh/sshd_config.d/01-packer.conf

# Also patch the main config and the redhat drop-in just in case
sed -i 's/^PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
sed -i 's/^PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
[ -f /etc/ssh/sshd_config.d/50-redhat.conf ] && \
  sed -i 's/^PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config.d/50-redhat.conf && \
  sed -i 's/^PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config.d/50-redhat.conf

systemctl restart sshd

# Install Ansible
pip3 install --upgrade pip
pip3 install ansible-core

# Create ansible user
useradd -m -s /bin/bash ansible 2>/dev/null || true
echo "ansible:${vm_root_password}" | chpasswd
echo "ansible ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/ansible
chmod 0440 /etc/sudoers.d/ansible

%end

# Reboot after installation
reboot
